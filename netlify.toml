# Netlify Configuration for The Underground Circle

[build]
  command = "npm run build"
  publish = "dist"

# Environment variables (set these in Netlify UI: Site Settings → Environment variables)
# EXPO_PUBLIC_SUPABASE_URL
# EXPO_PUBLIC_SUPABASE_ANON_KEY
# EXPO_PUBLIC_GEMINI_API_KEY

# Temporary workaround: Bypass secrets scanning for known public/limited-scope keys
# Remove this once env vars are properly configured in Netlify UI
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBDMkKrkuD7s-H3fT5krGm-OoWP5kfYR8o"

# Redirect rules for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
