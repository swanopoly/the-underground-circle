# Netlify Configuration for The Underground Circle

[build]
  command = "npm run build"
  publish = "dist"

# Environment variables (set these in Netlify UI: Site Settings → Environment variables)
# EXPO_PUBLIC_SUPABASE_URL
# EXPO_PUBLIC_SUPABASE_ANON_KEY
# EXPO_PUBLIC_GEMINI_API_KEY

# Environment variables must be configured in Netlify UI (Site Settings → Environment variables)
# Never hardcode API keys here

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # connect-src allows localhost / 127.0.0.1 over both http and ws so the
    # web app at app.chrisswanson.xyz can talk to the user's locally-running
    # bridges (claude-bridge :7778, codex :7779, gemini :7780, cursor :7781,
    # openswan-proxy :18790). Without these the browser silently blocks the
    # fetch and bridges look offline. localhost is exempt from mixed-content
    # restrictions but CSP still applies.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://api.mainnet-beta.solana.com https://api.devnet.solana.com https://solana-rpc.publicnode.com https://rpc.ankr.com https://*.infura.io https://*.alchemy.com https://*.quicknode.pro https://generativelanguage.googleapis.com https://api.openai.com https://api.anthropic.com https://api.coinbase.com https://api.coingecko.com https://cdn-icons-png.freepik.com; frame-src 'self';"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA redirect (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
